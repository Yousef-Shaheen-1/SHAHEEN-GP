name: Cloud Full-Stack Deployment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment (staging or production)'
        required: true
        default: 'staging'

permissions:
  contents: read

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Strict Linting
        run: npm run lint

      - name: Production Build
        run: npm run build

      - name: Container & Cloud Verification Notice
        run: |
          echo "=========================================================="
          echo "SHAHEEN GROUP — Cloud Full-Stack Deployment Pipeline"
          echo "Target Environment: ${{ github.event.inputs.target_env }}"
          echo "Full-stack server: tsx server.ts (Express + Vite Proxy)"
          echo "Configure CLOUD_DEPLOY_SECRET / GEMINI_API_KEY in repo secrets."
          echo "=========================================================="
